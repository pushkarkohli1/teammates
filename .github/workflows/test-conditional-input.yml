name: test-conditional-input

on:
  workflow_dispatch:
    inputs:
      deploy-description:
        description: "Deploy Comments/Notes"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest-internal
    steps:
      - name: Test With Deploy Description
        if: ${{ inputs.deploy-description != '' }}
        run: echo "This is a test for conditional Delpoy Description.\n ${{inputs.deploy-description && Deploy Description:" {{ inputs.deploy-description }}"
      - name: Test Without Deploy Description
        if: ${{ inputs.deploy-description == '' }}
        run: echo "This is a test for conditional Delpoy Description.\n ${{inputs.deploy-description && Deploy Description:" {{ inputs.deploy-description }}"
